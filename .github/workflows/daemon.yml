name: daemon

on:
  push:
    branches: ['**']
    paths: ['daemon/**', 'spec/**', '.github/workflows/daemon.yml']
  pull_request:
    branches: ['**']
    paths: ['daemon/**', 'spec/**', '.github/workflows/daemon.yml']
  schedule:
    - cron: '17 3 * * *' # nightly: fuzzers run 10 minutes each

permissions:
  contents: read

concurrency:
  group: daemon-${{ github.ref }}
  cancel-in-progress: true

env:
  CURL_VERSION: '8.23.0'
  CURL_PREFIX: /opt/curl
  CLANG_FORMAT_VERSION: '23.1.4'

jobs:
  # Phase 1: code quality and compilation.
  quality:
    name: "Phase 1: code quality & compilation (${{ matrix.cc }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libuv1-dev libssl-dev \
            clang clang-tidy cppcheck pkg-config xz-utils
      - name: Cache curl
        id: curlcache
        uses: actions/cache@v4
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-${{ env.CURL_VERSION }}-ubuntu-24.04-openssl
      - name: Build curl >= 8.11 from source
        run: daemon/tools/ci-install-curl.sh
      - name: Point build at the new curl
        run: |
          echo "PKG_CONFIG_PATH=$CURL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CURL_PREFIX/lib" >> "$GITHUB_ENV"
      - name: Configure
        working-directory: daemon
        run: cmake --preset dev -DCMAKE_C_COMPILER=$CC
      - name: Build
        working-directory: daemon
        run: cmake --build --preset dev
      - name: Install pinned clang-format
        run: pip install "clang-format==$CLANG_FORMAT_VERSION"
      - name: clang-format check
        working-directory: daemon
        run: tools/format-files.sh | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        if: matrix.cc == 'gcc'
        working-directory: daemon
        run: tools/format-files.sh | grep '^src/.*\.c$' | xargs clang-tidy -p build/dev --quiet
      - name: cppcheck
        if: matrix.cc == 'gcc'
        working-directory: daemon
        run: |
          tools/format-files.sh | grep '^src/.*\.c$' | xargs cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --quiet \
            --suppress='*:src/pgvector/*' --suppress='*:src/pgcompat/include/*' \
            -D__BYTE_ORDER__=1234 -D__ORDER_LITTLE_ENDIAN__=1234 -D__x86_64__=1 -DAV_REPO_ROOT='"/"' \
            -Isrc -Isrc/pgcompat/include -Isrc/pgvector -Ibuild/dev/generated

  provenance:
    name: Copied pgvector/PostgreSQL code unmodified (V/F/S provenance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sparse checkout of PostgreSQL REL_17_11
        run: |
          git clone --depth 1 --branch REL_17_11 --filter=blob:none --sparse \
            https://github.com/postgres/postgres "$RUNNER_TEMP/pg"
          git -C "$RUNNER_TEMP/pg" sparse-checkout set src/include src/backend/lib src/backend/nodes \
            src/backend/utils/adt src/common src/port
      - name: check_provenance.py
        run: python3 -I daemon/tools/check_provenance.py --postgres "$RUNNER_TEMP/pg"

  # Phase 2: integration tests. Skipped (and so not green) if Phase 1 fails.
  integration:
    name: "Phase 2: integration tests"
    needs: [quality, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libuv1-dev libssl-dev \
            clang pkg-config xz-utils
      - name: Cache curl
        uses: actions/cache@v4
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-${{ env.CURL_VERSION }}-ubuntu-24.04-openssl
      - name: Build curl >= 8.11 from source
        run: daemon/tools/ci-install-curl.sh
      - name: Point build at the new curl
        run: |
          echo "PKG_CONFIG_PATH=$CURL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CURL_PREFIX/lib" >> "$GITHUB_ENV"
      - name: ASan + UBSan build
        working-directory: daemon
        run: cmake --preset asan && cmake --build --preset asan
      - name: Unit tests (ASan + UBSan)
        working-directory: daemon
        run: ctest --preset asan
      - name: TSan build (clang)
        working-directory: daemon
        run: cmake --preset tsan && cmake --build --preset tsan
      - name: Unit tests (TSan)
        working-directory: daemon
        # TSan cannot map its shadow memory with the runner's vm.mmap_rnd_bits=32
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          ctest --preset tsan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration test requirements
        run: pip install -r daemon/test/integration/requirements.txt -r daemon/testkit/mock-arkiv/requirements.txt
      - name: mock-arkiv selftest
        run: python daemon/testkit/mock-arkiv/selftest.py
      - name: Integration tests
        run: pytest -q daemon/test/integration
      - name: Dev build (parity CLI)
        working-directory: daemon
        run: cmake --preset dev && cmake --build --preset dev
      - name: pgvector parity suite (real pgvector 0.8.7)
        run: |
          pip install -r daemon/test/parity/requirements.txt
          docker compose -f daemon/test/parity/docker-compose.yml up -d --wait
          PARITY_N=2000 pytest -q daemon/test/parity
          docker compose -f daemon/test/parity/docker-compose.yml down -v

  fuzz:
    name: "Phase 2: fuzz smoke (libFuzzer, 60 s per target)"
    needs: [quality, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libuv1-dev libssl-dev \
            clang pkg-config xz-utils
      - name: Cache curl
        uses: actions/cache@v4
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-${{ env.CURL_VERSION }}-ubuntu-24.04-openssl
      - name: Build curl from source
        run: daemon/tools/ci-install-curl.sh
      - name: Point build at the new curl
        run: |
          echo "PKG_CONFIG_PATH=$CURL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CURL_PREFIX/lib" >> "$GITHUB_ENV"
      - name: Build fuzzers
        working-directory: daemon
        run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Run fuzzers
        working-directory: daemon
        run: |
          for t in build/fuzz/test/fuzz_*; do
            name=$(basename "$t"); corpus="test/fuzz/corpus/${name#fuzz_}"
            mkdir -p "$corpus"
            "$t" -max_total_time=${FUZZ_SECONDS:-60} -max_len=200000 "$corpus"
          done

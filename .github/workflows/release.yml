name: release

# Tag vX.Y.Z (or daemon-vX.Y.Z) to publish:
#   - GitHub Release: arkivectord linux-x86_64 tarball (libcurl bundled), Python wheel + sdist, npm tarball
#   - GitHub Packages (npm): @dikshitrj/arkivector-client
#   - GHCR: ghcr.io/<owner>/arkivectord:<version>, :<major>, :latest (linux/amd64)
#   - PyPI: trusted publishing from job pypi-publish (environment `pypi`; GitHub Packages has no pip registry)
on:
  push:
    tags: ['v*', 'daemon-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0); publishes the packages'
        required: true
      create_release:
        description: 'Also create the tag v<version> on this commit and the GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CURL_VERSION: '8.23.0'
  CURL_PREFIX: /opt/curl

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else
            v="${GITHUB_REF_NAME#daemon-}"; v="${v#v}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

  daemon:
    name: arkivectord linux-x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libuv1-dev libssl-dev pkg-config xz-utils patchelf
      - name: Cache curl
        uses: actions/cache@v4
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-${{ env.CURL_VERSION }}-ubuntu-24.04-openssl
      - name: Build curl >= 8.11 from source
        run: daemon/tools/ci-install-curl.sh
      - name: Build
        working-directory: daemon
        env:
          PKG_CONFIG_PATH: ${{ env.CURL_PREFIX }}/lib/pkgconfig
        run: |
          cmake --preset release -DAV_BUILD_TESTS=OFF -DAV_BUILD_BENCH=OFF -DAV_VERSION=${{ needs.version.outputs.v }}
          cmake --build --preset release --target arkivectord
      - name: Package (bundle libcurl, RPATH $ORIGIN/../lib)
        run: |
          d=arkivectord-${{ needs.version.outputs.v }}-linux-x86_64
          mkdir -p dist $d/bin $d/lib
          cp daemon/build/release/arkivectord $d/bin/
          cp -L $CURL_PREFIX/lib/libcurl.so.4 $d/lib/
          patchelf --set-rpath '$ORIGIN/../lib' $d/bin/arkivectord
          strip $d/bin/arkivectord
          cp daemon/arkivector.example.toml $d/ 2>/dev/null || true
          cp daemon/src/pgvector/LICENSE.pgvector daemon/src/pgcompat/LICENSE.postgresql $d/
          $d/bin/arkivectord --version
          tar -czf dist/$d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: dist/*

  sdk-python:
    name: Python SDK (wheel + sdist)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.version.outputs.v }}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${{ needs.version.outputs.v }}\"/" src/arkivector/__init__.py
          pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/t && /tmp/t/bin/pip install dist/*.whl && /tmp/t/bin/python -c "import arkivector; print(arkivector.__name__, 'ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: sdk/python/dist/*

  # PyPI trusted publishing (OIDC, no token). PyPI publisher settings must match:
  #   owner DikshitRJ · repository arkivector · workflow release.yml · environment pypi
  pypi-publish:
    name: Publish Python SDK to PyPI
    needs: sdk-python
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/arkivector
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  sdk-node:
    name: Node SDK (GitHub Packages)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dikshitrj'
      - name: Build and pack
        working-directory: sdk/node
        run: |
          v=${{ needs.version.outputs.v }}
          sed -i "s/^export const VERSION = .*/export const VERSION = \"$v\";/" src/index.ts
          npm pkg set version="$v"
          npm ci
          npm run build
          mkdir -p ../../dist && npm pack --pack-destination ../../dist
          mv ../../dist/*.tgz ../../dist/arkivector-node-$v.tgz
      - name: Publish to GitHub Packages
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish || echo "::warning::version already published"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-node
          path: dist/*.tgz

  docker:
    name: Container image (ghcr.io)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arkivectord" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.v }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.v }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=arkivectord
            org.opencontainers.image.description=pgvector for Arkiv: off-chain vector co-processor daemon
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: daemon/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ needs.version.outputs.v }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test pushed image
        run: |
          docker run -d --name av -p 127.0.0.1:8080:8080 ${{ steps.img.outputs.name }}:${{ needs.version.outputs.v }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/v1/version | grep '"daemon_version":"${{ needs.version.outputs.v }}"'
          docker rm -f av

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    needs: [version, daemon, docker, sdk-python, sdk-node]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      # Only our artifacts: docker/build-push-action also uploads a *.dockerbuild record that
      # download-artifact cannot extract.
      - uses: actions/download-artifact@v4
        with:
          name: daemon
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdk-python
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdk-node
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Render release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v${{ needs.version.outputs.v }}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          export TAG REPO="$GITHUB_REPOSITORY" OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export VERSION="${TAG#daemon-}"; VERSION="${VERSION#v}"; export MAJOR="${VERSION%%.*}"
          envsubst '${TAG} ${REPO} ${OWNER} ${VERSION} ${MAJOR}' < .github/release-notes.md > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          args=()
          for f in *; do
            case "$f" in
              *.whl) args+=("$f#${f/arkivector-/arkivector-python-} (Python wheel)") ;;
              arkivector-[0-9]*.tar.gz) args+=("$f#${f/arkivector-/arkivector-python-} (Python sdist)") ;;
              *) args+=("$f") ;;
            esac
          done
          # A tag push releases that tag; a dispatch with create_release creates the tag on this commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then target=(--verify-tag); else target=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Arkivector $TAG" \
            --notes-file ../notes.md "${target[@]}" "${args[@]}"

name: release

# Tag vX.Y.Z (or daemon-vX.Y.Z) to publish:
#   - GitHub Release: arkivectord linux-x86_64 tarball (libcurl bundled), Python wheel + sdist, npm tarball
#   - GitHub Packages (npm): @dikshitrj/arkivector-client
#   - PyPI: only when the PYPI_API_TOKEN secret is set (GitHub Packages has no pip registry)
on:
  push:
    tags: ['v*', 'daemon-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0); publishes packages but creates no Release'
        required: true

permissions:
  contents: write
  packages: write

env:
  CURL_VERSION: '8.23.0'
  CURL_PREFIX: /opt/curl

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else
            v="${GITHUB_REF_NAME#daemon-}"; v="${v#v}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

  daemon:
    name: arkivectord linux-x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libuv1-dev libssl-dev pkg-config xz-utils patchelf
      - name: Cache curl
        uses: actions/cache@v4
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-${{ env.CURL_VERSION }}-ubuntu-24.04-openssl
      - name: Build curl >= 8.11 from source
        run: daemon/tools/ci-install-curl.sh
      - name: Build
        working-directory: daemon
        env:
          PKG_CONFIG_PATH: ${{ env.CURL_PREFIX }}/lib/pkgconfig
        run: |
          cmake --preset release -DAV_BUILD_TESTS=OFF -DAV_BUILD_BENCH=OFF
          cmake --build --preset release --target arkivectord
      - name: Package (bundle libcurl, RPATH $ORIGIN/../lib)
        run: |
          d=arkivectord-${{ needs.version.outputs.v }}-linux-x86_64
          mkdir -p dist $d/bin $d/lib
          cp daemon/build/release/arkivectord $d/bin/
          cp -L $CURL_PREFIX/lib/libcurl.so.4 $d/lib/
          patchelf --set-rpath '$ORIGIN/../lib' $d/bin/arkivectord
          strip $d/bin/arkivectord
          cp daemon/arkivector.example.toml $d/ 2>/dev/null || true
          cp daemon/src/pgvector/LICENSE.pgvector daemon/src/pgcompat/LICENSE.postgresql $d/
          $d/bin/arkivectord --version
          tar -czf dist/$d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: dist/*

  sdk-python:
    name: Python SDK (wheel + sdist)
    needs: version
    runs-on: ubuntu-24.04
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.version.outputs.v }}\"/" pyproject.toml
          pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/t && /tmp/t/bin/pip install dist/*.whl && /tmp/t/bin/python -c "import arkivector; print(arkivector.__name__, 'ok')"
      - name: Publish to PyPI (optional)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: twine upload --skip-existing dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: sdk/python/dist/*

  sdk-node:
    name: Node SDK (GitHub Packages)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dikshitrj'
      - name: Build and pack
        working-directory: sdk/node
        run: |
          npm ci
          npm run build
          npm pkg set name="@dikshitrj/arkivector-client" version="${{ needs.version.outputs.v }}" \
            publishConfig.registry="https://npm.pkg.github.com" \
            repository.type=git repository.url="git+https://github.com/${{ github.repository }}.git"
          mkdir -p ../../dist && npm pack --pack-destination ../../dist
      - name: Publish to GitHub Packages
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish || echo "::warning::version already published"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-node
          path: dist/*.tgz

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [daemon, sdk-python, sdk-node]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

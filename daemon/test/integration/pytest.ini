[pytest]
testpaths = .
addopts = -ra
markers =
    mock: conformance tests of daemon/testkit/mock-arkiv (no daemon binary needed)
    sync: daemon chain-sync tests (needs arkivectord)
    ttl: daemon TTL / expiry tests (needs arkivectord)
    reorg: daemon reorg handling tests (needs arkivectord)
    search: daemon vector search tests (needs arkivectord)
    filters: daemon filter tests (needs arkivectord)
    hnsw: daemon HNSW index tests (needs arkivectord)
    writes: daemon write-path tests (needs arkivectord)
    daemon: requires the arkivectord binary (daemon/build/dev/arkivectord)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkivector"
version = "0.1.0"
description = "Arkivector Python SDK: Vector co-processor client for Arkiv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/arkivector"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["arkivector"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
